<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-shield">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="title">Shield Minimal</span>
      </div>
      <div class="version-tag" id="ruleVersion">v1.0.0</div>
    </header>

    <!-- Main Status Card -->
    <section class="card status-card">
      <div class="status-content">
        <div class="status-text">
          <div class="status-badge" id="statusBadge">Active</div>
          <span class="status-domain" id="currentDomain">example.com</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="siteToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Counter Metric Bento -->
    <section class="metrics-grid">
      <div class="card metric-box">
        <div class="metric-label">累计拦截</div>
        <div class="metric-val" id="totalBlockedCount">0</div>
      </div>
      <div class="card metric-box">
        <div class="metric-label">当前规则数</div>
        <div class="metric-val text-success" id="totalRulesCount">0</div>
      </div>
    </section>

    <!-- 规则管理扩展区域 -->
    <section class="card config-card">
      <div class="card-title">规则同步与管理</div>
      
      <!-- 远程订阅地址 -->
      <div class="input-group">
        <input type="text" id="syncUrlInput" placeholder="输入远程 JSON 订阅源 URL..." />
        <button id="syncRemoteBtn" class="secondary-btn" title="立即拉取远程">拉取</button>
      </div>

      <!-- 本地导入与导出按钮组 -->
      <div class="btn-group">
        <input type="file" id="fileInput" accept=".json" style="display: none;" />
        <button id="importFileBtn" class="action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入 JSON
        </button>
        <button id="exportFileBtn" class="action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出备份
        </button>
      </div>
      <div class="sync-msg" id="syncMsg"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-status">
        <span class="indicator online"></span>
        <span id="footerText">DNR 底层驱动</span>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
